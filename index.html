    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #101114;

            color: white;

            height: 100vh;

            overflow: hidden;
        }


        /* =========================
           PANTALLA DE ENTRADA
        ========================== */

        #login-screen {

            position: fixed;

            inset: 0;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                radial-gradient(
                    circle at top,
                    #252936,
                    #101114 60%
                );
        }


        .login-box {

            width: min(90%, 400px);

            padding: 35px;

            background: #191b20;

            border: 1px solid #2d3038;

            border-radius: 18px;

            text-align: center;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.4);
        }


        .login-box h1 {

            font-size: 30px;

            margin-bottom: 10px;
        }


        .login-box p {

            color: #aeb2bd;

            margin-bottom: 25px;

            line-height: 1.5;
        }


        #username {

            width: 100%;

            padding: 14px 16px;

            background: #101114;

            color: white;

            border: 1px solid #343842;

            border-radius: 10px;

            outline: none;

            font-size: 16px;

            margin-bottom: 15px;
        }


        #username:focus {

            border-color: #666d7c;
        }


        #enter-button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            color: #111;

            font-size: 16px;

            cursor: pointer;

            transition: 0.2s;
        }


        #enter-button:hover {

            transform: translateY(-2px);

            background: #e9e9e9;
        }


        /* =========================
           CHAT
        ========================== */

        #chat-screen {

            display: none;

            height: 100vh;

            width: 100%;

            flex-direction: column;
        }


        .chat-header {

            height: 65px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background: #191b20;

            border-bottom: 1px solid #2d3038;
        }


        .chat-title {

            display: flex;

            align-items: center;

            gap: 10px;
        }


        .chat-icon {

            width: 38px;

        /* =========================
           MENSAJES

        #messages {

            flex: 1;

            overflow-y: auto;

            padding: 20px;

            display: flex;

            flex-direction: column;

            gap: 10px;

            background: #101114;

        .message {

            display: block;

        .system-message {

            align-self: center;

            max-width: 90%;

            color: #777c87;

        /* =========================

        .message-area {

            display: flex;

        #message-input {

            flex: 1;

            outline: none;

            font-size: 15px;
        }


        #send-button {

            border: none;

            border-radius: 10px;

            background: white;

            font-size: 20px;

            cursor: pointer;

            transition: 0.2s;
        }


        #send-button:hover {

            transform: scale(1.05);
        }


        /* =========================
           MÓVIL
        ========================== */

        @media (max-width: 600px) {

            .login-box {

                padding: 28px 22px;
            }


            .chat-header {

                padding: 0 12px;
            }


            #messages {

                padding: 12px;
            }


            .message {

                max-width: 85%;
            }


            #current-user {

                display: none;
            }

    </style>

</head>


<body>


    <!-- =========================
         ENTRADA
    ========================== -->

    <section id="login-screen">

        <div class="login-box">

            <h1>💬 Chat Privado</h1>

            <p>
                Elige el nombre que aparecerá
                junto a tus mensajes.
            </p>


            <input
                type="text"
                id="username"
                maxlength="20"
                placeholder="Tu nombre..."
                autocomplete="off"
            >


            <button id="enter-button">

                Entrar al chat

            </button>

        </div>

    </section>



    <!-- =========================
         CHAT
    ========================== -->

    <main id="chat-screen">


        <header class="chat-header">

            <div class="chat-title">

                <div class="chat-icon">
                    💬
                </div>


                <div>

                    <h2>
                        Chat Privado
                    </h2>

                    <span class="online">
                        Chat grupal
                    </span>

                </div>

            </div>


            <div id="current-user"></div>

        </header>



        <!-- MENSAJES -->

        <section id="messages">

            <div class="message system-message">

                <div class="name">
                    💬 Sistema
                </div>

                <div class="text">
                    Bienvenido al chat 👋
                </div>

            </div>

        </section>



        <!-- ESCRIBIR -->

        <form
            class="message-area"
            id="message-form"
        >

            <input
                type="text"
                id="message-input"
                placeholder="Escribe un mensaje..."
                autocomplete="off"
            >


            <button
                type="submit"
                id="send-button"
                aria-label="Enviar mensaje"
            >
                ➤
            </button>

        </form>


    </main>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>


        /* =====================================
           CONFIGURACIÓN DE SUPABASE
        ====================================== */

        const SUPABASE_URL =
            "https://gbjxznnjcsfunxdunrui.supabase.co";


        /*
           PEGA AQUÍ TU PUBLISHABLE KEY

           Ejemplo:

           const SUPABASE_KEY =
               "sb_publishable_XXXXXXXX";
        */

        const SUPABASE_KEY =
            "sb_publishable_CI7pM-3N3Av_Gb3y6y0xsw_24NrAZqY";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );



        /* =====================================
           ELEMENTOS
        ====================================== */

        const loginScreen =
            document.getElementById(
                "login-screen"
            );


        const chatScreen =
            document.getElementById(
                "chat-screen"
            );


        const usernameInput =
            document.getElementById(
                "username"
            );


        const enterButton =
            document.getElementById(
                "enter-button"
            );


        const currentUser =
            document.getElementById(
                "current-user"
            );


        const messageForm =
            document.getElementById(
                "message-form"
            );


        const messageInput =
            document.getElementById(
                "message-input"
            );


        const messages =
            document.getElementById(
                "messages"
            );



        /* =====================================
           DATOS DEL CHAT
        ====================================== */

        let username = "";


        /*
           El chat se identifica mediante:

           ?chat=abc123

           Si no existe, usamos "general".
        */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const chatId =
            params.get("chat") || "general";



        /* =====================================
           ENTRAR
        ====================================== */

        async function enterChat() {


            const name =
                usernameInput.value.trim();


            if (name === "") {

                usernameInput.focus();

                return;

            }


            username = name;


            currentUser.textContent =
                "👤 " + username;


            loginScreen.style.display =
                "none";


            chatScreen.style.display =
                "flex";


            await loadMessages();


            subscribeToMessages();


            messageInput.focus();

        }



        enterButton.addEventListener(
            "click",
            enterChat
        );



        usernameInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    enterChat();

                }

            }
        );



        /* =====================================
           CARGAR MENSAJES
        ====================================== */

        async function loadMessages() {


            const {
                data,
                error
            } = await supabaseClient

                .from("messages")

                .select("*")

                .eq("chat_id", chatId)

                .order(
                    "created_at",
                    {
                        ascending: true
                    }
                );


            if (error) {

                console.error(
                    "Error cargando mensajes:",
                    error
                );

                return;

            }


            data.forEach(
                addMessageToScreen
            );


            scrollToBottom();

        }



        /* =====================================
           MOSTRAR MENSAJE
        ====================================== */

        function addMessageToScreen(
            message
        ) {


            const element =
                document.createElement(
                    "div"
                );


            element.classList.add(
                "message"
            );


            const name =
                document.createElement(
                    "div"
                );


            name.classList.add(
                "name"
            );


            name.textContent =
                message.username;


            const text =
                document.createElement(
                    "div"
                );


            text.classList.add(
                "text"
            );


            text.textContent =
                message.message;


            const time =
                document.createElement(
                    "span"
                );


            time.classList.add(
                "time"
            );


            const date =
                new Date(
                    message.created_at
                );


            time.textContent =
                date.toLocaleTimeString(
                    [],
                    {
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );


            element.appendChild(name);

            element.appendChild(text);

            element.appendChild(time);


            messages.appendChild(
                element
            );


            scrollToBottom();

        }



        /* =====================================
           ENVIAR MENSAJE
        ====================================== */

        messageForm.addEventListener(
            "submit",
            async function(event) {


                event.preventDefault();


                const text =
                    messageInput.value.trim();


                if (text === "") {

                    return;

                }


                const {
                    error
                } = await supabaseClient

                    .from("messages")

                    .insert({

                        chat_id: chatId,

                        username: username,

                        message: text

                    });


                if (error) {

                    console.error(
                        "Error enviando mensaje:",
                        error
                    );

                    alert(
                        "No se pudo enviar el mensaje."
                    );

                    return;

                }


                messageInput.value = "";

                messageInput.focus();

            }
        );



        /* =====================================
           TIEMPO REAL
        ====================================== */

        function subscribeToMessages() {


            supabaseClient

                .channel(
                    "chat-" + chatId
                )

                .on(
                    "postgres_changes",
                    {
                        event: "INSERT",

                        schema: "public",

                        table: "messages",

                        filter:
                            "chat_id=eq." +
                            chatId
                    },

                    function(payload) {

                        addMessageToScreen(
                            payload.new
                        );

                    }

                )

                .subscribe();

        }



        /* =====================================
           SCROLL
        ====================================== */

        function scrollToBottom() {

            messages.scrollTop =
                messages.scrollHeight;

        }


    </script>


</body>

</html>
